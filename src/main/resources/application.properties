spring.application.name=portal-solicitacoes

# Lê as variáveis do arquivo .env (na pasta do backend ou na raiz do repositório).
# Variáveis de ambiente do sistema têm prioridade sobre o arquivo.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cria os usuários de demonstração e solicitações de exemplo na primeira execução
app.seed.enabled=${APP_SEED_ENABLED:true}

# Endereços do frontend que podem chamar a API (separados por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
